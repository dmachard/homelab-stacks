# =============================================================================
# Static CDN — Lightweight Nginx static file server
# =============================================================================
# Included by apps/docker-compose.yml.
#
# Required environment variables (defined in apps/.env):
#   - CDN_NGINX_VERSION, CDN_HOST, DATA_DIR
# =============================================================================

networks:
  # Shared network with the Traefik reverse proxy
  traefik_proxy:
    external: true

services:
  cdn:
    image: nginx:${CDN_NGINX_VERSION}
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.services.cdn.loadbalancer.server.port=80
      - traefik.http.routers.cdn.entrypoints=websecure
      - traefik.http.routers.cdn.rule=Host(`${CDN_HOST}`)
      - traefik.http.routers.cdn.tls.certresolver=letsencrypt
    networks:
      - traefik_proxy
    volumes:
      - ${DATA_DIR}/cdn/static:/usr/share/nginx/html:ro # Static assets served over HTTPS
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro  # Nginx virtual host configuration
