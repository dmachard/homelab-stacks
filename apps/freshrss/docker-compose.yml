# =============================================================================
# FreshRSS — Self-hosted RSS/Atom feed aggregator
# =============================================================================
# Included by apps/docker-compose.yml.
#
# Required environment variables (defined in apps/.env):
#   - FRESHRSS_VERSION, FRESHRSS_HOST, TZ, DATA_DIR
# =============================================================================

networks:
  # Shared network with the Traefik reverse proxy
  traefik_proxy:
    external: true

services:
  freshrss:
    image: freshrss/freshrss:${FRESHRSS_VERSION}
    container_name: freshrss
    restart: unless-stopped
    networks:
      - traefik_proxy
    labels:
      - traefik.enable=true
      - traefik.http.services.rss.loadbalancer.server.port=80
      - traefik.http.routers.rss.entrypoints=websecure
      - traefik.http.routers.rss.rule=Host(`${FRESHRSS_HOST}`)
      - traefik.http.routers.rss.tls.certresolver=letsencrypt
    environment:
      TZ: ${TZ}
      CRON_MIN: "1,31"           # Refresh feeds every 30 minutes
      INTERNAL_HOST_ALLOWLIST: "*"
    volumes:
      - ${DATA_DIR}/actu/freshrss-data:/var/www/FreshRSS/data             # Persistent feeds & database
      - ${DATA_DIR}/actu/freshrss-extensions:/var/www/FreshRSS/extensions # Installed extensions
